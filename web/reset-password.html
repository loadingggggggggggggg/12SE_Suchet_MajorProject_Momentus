<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#141414" />
    <meta name="description" content="Reset your Momentus password." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/static/assets/Logo.png" type="image/png" />
    <link rel="stylesheet" href="/static/styles.css" />
    <title>Reset Password | Momentus</title>
  </head>
  <body class="auth-page">
    <div class="landing-bg" aria-hidden="true"></div>
    <main class="auth-shell">
      <section class="auth-panel system-card">
        <a class="marketing-brand" href="/">
          <img src="/static/assets/Logo.png" alt="Momentus logo" />
          <span>Momentus</span>
        </a>
        <div class="auth-panel-form">
          <h2>Set a new password</h2>
          <p>Choose a new password for your account. Once you save it, all older sessions are signed out.</p>
          <ul class="auth-points">
            <li>Use at least 8 characters.</li>
            <li>Include both letters and numbers.</li>
            <li>Then head back to login with your new password.</li>
          </ul>
        </div>
      </section>

      <section class="signup-card auth-panel">
        <h2>Reset password</h2>
        <form class="auth-form" id="authResetPasswordForm">
          <label>
            <span>New Password</span>
            <input id="resetPasswordNew" type="password" autocomplete="new-password" required />
          </label>
          <label>
            <span>Confirm New Password</span>
            <input id="resetPasswordConfirm" type="password" autocomplete="new-password" required />
          </label>
          <button class="primary-button" type="submit"><span>Save new password</span></button>
        </form>
        <div class="auth-feedback" id="authFeedback" aria-live="polite"></div>
        <p class="auth-switch"><a href="/login">Back to login</a></p>
      </section>
    </main>

    <script type="module" src="/static/auth-pages.js"></script>
  </body>
</html>
